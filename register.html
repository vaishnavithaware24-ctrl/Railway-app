<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRMS — Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">RAIL<span>WAY</span> RRMS</div>
</div>

<div class="auth-shell">
  <h2>Create account</h2>

  <form id="regForm">
    <label for="name">Full name</label>
    <input type="text" id="name" required>

    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" minlength="4" required>

    <button type="submit" class="btn btn-amber full">Register</button>
  </form>

  <p id="msg"></p>

  <p style="margin-top:20px; font-size:0.9rem;">
    Already have an account? <a href="index.html">Log in</a>
  </p>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("regForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const result = registerUser(name, email, password);
    const msg = document.getElementById("msg");
    msg.className = result.ok ? "success" : "error";
    msg.textContent = result.message;

    if (result.ok) {
      setTimeout(() => window.location.href = "index.html", 900);
    }
  });
</script>
</body>
</html>
