<!DOCTYPE html>
<html lang="en">
<head>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">

  <nav>

<script src="js/data.js"></script>

  const user = requireLogin();
  renderHistory(user);
  document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logoutUser(); });
</script>
