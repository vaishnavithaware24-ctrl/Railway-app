<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRMS — Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">RAIL<span>WAY</span> RRMS</div>
</div>

<div class="auth-shell">
  <h2>Log in</h2>
  <p style="color:var(--track-grey); font-size:0.85rem;">Demo admin — admin@rrms.com / admin123</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" required>

    <button type="submit" class="btn btn-amber full">Log in</button>
  </form>

  <p id="msg" class="error"></p>

  <p style="margin-top:20px; font-size:0.9rem;">
    New here? <a href="register.html">Create an account</a>
  </p>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const result = loginUser(email, password);
    const msg = document.getElementById("msg");

    if (!result.ok) {
      msg.textContent = result.message;
      return;
    }
    window.location.href = result.user.role === "admin" ? "admin.html" : "search.html";
  });
</script>
</body>
</html>
