<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RRMS — Book Ticket</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">RAIL<span>WAY</span> RRMS</div>
  <nav>
    <a href="search.html">Search</a>
    <a href="dashboard.html">My Bookings</a>
    <a href="#" id="logoutLink">Log out</a>
  </nav>
</div>

<div class="page" id="page">
  <div id="trainInfo"></div>

  <div class="section-title"><h3>Select a seat</h3></div>
  <div class="seat-grid" id="seatGrid"></div>

  <div id="bookingPanel" class="ticket-card" style="padding:20px; margin-top:20px;">
    <div>
      <p style="color:var(--track-grey); margin:0 0 12px;">
        Choose a seat above, then confirm to simulate payment and complete the booking.
      </p>
      <button id="confirmBtn" class="btn btn-amber" disabled>Confirm &amp; Pay</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/booking.js"></script>
<script>
  const user = requireLogin();
  const trainId = getTrainIdFromUrl();
  const train = getTrains().find(t => t.id === trainId);

  if (!train) {
    document.getElementById("page").innerHTML = `<div class="empty-state">Train not found.</div>`;
  } else {
    document.getElementById("trainInfo").innerHTML = `
      <h1>${train.name}</h1>
      <p style="color:var(--track-grey);">
        ${train.source} &rarr; ${train.destination} &middot; ${train.date} &middot; ${train.time} &middot; &#8377;${train.fare} per seat
      </p>
    `;
    renderSeatGrid(train);
    document.getElementById("confirmBtn").addEventListener("click", () => confirmBooking(train, user));
  }

  document.getElementById("logoutLink").addEventListener("click", (e) => { e.preventDefault(); logoutUser(); });
</script>
</body>
</html>
